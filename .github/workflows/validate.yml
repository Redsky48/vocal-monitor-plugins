name: Validate plugins

on:
  pull_request:
    paths:
      - 'plugins/**'
      - 'scripts/**'
      - '.github/workflows/validate.yml'
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - 'scripts/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate every plugin
        run: node scripts/validate-plugins.mjs
      - name: Dry-run manifest build
        run: node scripts/build-manifest.mjs
