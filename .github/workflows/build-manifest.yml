name: Rebuild manifest

on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - 'scripts/build-manifest.mjs'
      - 'repo.config.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build manifest
        run: node scripts/build-manifest.mjs
      - name: Commit manifest if changed
        run: |
          if [[ -n "$(git status --porcelain manifest.json)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add manifest.json
            git commit -m "ci: rebuild manifest.json [skip ci]"
            git push
          else
            echo "manifest.json is already up to date."
          fi
