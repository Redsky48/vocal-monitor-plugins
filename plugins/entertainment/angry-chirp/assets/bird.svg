<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 -50 100 100">
  <!-- Tail feathers (drawn first so body overlaps) -->
  <polygon points="-28,-10 -44,-6 -42,2 -28,4" fill="#E25656" stroke="#2A2A2A" stroke-width="1.5"/>
  <polygon points="-26,0  -46,4  -44,12 -26,12" fill="#C03434" stroke="#2A2A2A" stroke-width="1.5"/>
  <!-- Body (oval) -->
  <ellipse cx="0" cy="0" rx="32" ry="28" fill="#FFD34A" stroke="#2A2A2A" stroke-width="2.5"/>
  <!-- Belly (lighter underside) -->
  <ellipse cx="2" cy="8" rx="22" ry="16" fill="#FFF1B0"/>
  <!-- Wing -->
  <path d="M -10 -6 Q -22 -8 -20 12 Q -4 16 2 0 Z"
        fill="#FF8833" stroke="#2A2A2A" stroke-width="2"/>
  <!-- Wing feather lines -->
  <line x1="-14" y1="-4" x2="-8"  y2="6" stroke="#A04610" stroke-width="1.2"/>
  <line x1="-18" y1="0"  x2="-12" y2="10" stroke="#A04610" stroke-width="1.2"/>
  <!-- Cheek blush -->
  <circle cx="-2" cy="6" r="4" fill="#FF8B8B" opacity="0.6"/>
  <!-- Eye white -->
  <circle cx="12" cy="-6" r="11" fill="#FFFFFF" stroke="#2A2A2A" stroke-width="2"/>
  <!-- Pupil -->
  <circle cx="16" cy="-6" r="6" fill="#101018"/>
  <!-- Eye highlight -->
  <circle cx="18" cy="-9" r="2" fill="#FFFFFF"/>
  <!-- Angry brow -->
  <path d="M 4 -16 L 22 -10" stroke="#2A2A2A" stroke-width="3"/>
  <!-- Beak (upper) -->
  <polygon points="22,-2 42,2 22,4" fill="#FF8833" stroke="#2A2A2A" stroke-width="2"/>
  <!-- Beak (lower) -->
  <polygon points="22,4 38,6 22,10" fill="#D86620" stroke="#2A2A2A" stroke-width="2"/>
  <!-- Feet -->
  <line x1="-6" y1="26" x2="-10" y2="36" stroke="#FF8833" stroke-width="3"/>
  <line x1="10" y1="26" x2="14"  y2="36" stroke="#FF8833" stroke-width="3"/>
  <polyline points="-14,36 -10,36 -6,38" fill="none" stroke="#FF8833" stroke-width="3"/>
  <polyline points="10,38 14,36 18,36" fill="none" stroke="#FF8833" stroke-width="3"/>
</svg>
