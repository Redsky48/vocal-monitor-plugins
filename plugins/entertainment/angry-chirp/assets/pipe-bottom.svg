<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 300">
  <!-- Mirror of pipe-top: cap goes at the top now -->
  <!-- Pipe body shaft -->
  <rect x="6" y="40" width="88" height="260" fill="#7BC95B" stroke="#2A6B28" stroke-width="2"/>
  <rect x="14" y="40" width="6" height="260" fill="#A8E27D"/>
  <rect x="76" y="40" width="8" height="260" fill="#5BA340"/>
  <!-- Cap at the TOP (this pipe rises from the ground) -->
  <rect x="0" y="10" width="100" height="50" fill="#7BC95B" stroke="#2A6B28" stroke-width="2"/>
  <rect x="6" y="16" width="8" height="38" fill="#A8E27D"/>
  <rect x="84" y="16" width="10" height="38" fill="#5BA340"/>
  <circle cx="16" cy="34" r="3" fill="#2A6B28"/>
  <circle cx="84" cy="34" r="3" fill="#2A6B28"/>
  <!-- Top edge shadow -->
  <line x1="0" y1="10" x2="100" y2="10" stroke="#1A4A1A" stroke-width="3"/>
</svg>
